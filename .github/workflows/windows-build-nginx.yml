name: Windows-Build-Nginx
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-build-nginx.yml"

jobs:
  windows-x64-build:
   runs-on: windows-2022
   steps:
    - name: Get MSVC environment
      shell: pwsh
      run: |
        $out = cmd /c '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 >nul && cl 2>&1'
        $text = $out | Out-String
        Write-Host "$text"
        if ($text -match '(\d+\.\d+\.\d+.*for x64)') { "NGX_CC_VER=$($Matches[1])" >> $env:GITHUB_ENV }
        else { Write-Error "cl probe failed: $text"; exit 1 }

    - name: Add Msys2
      uses: msys2/setup-msys2@v2
      with:
        update: false
        install: >-
          curl
          git
          make
          tree
          nasm

    - name: Add StrawberryPerl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: "5"
        distribution: strawberry

    - name: Clone nginx source code
      shell: msys2 {0}
      run: |
        git clone --depth 1 -b release-1.30.1 https://github.com/nginx/nginx.git

    - name: Download dependencies
      shell: msys2 {0}
      run: |
        cd nginx
        curl -fSL --retry 3 --retry-delay 5 -OL https://raw.githubusercontent.com/VariatezzZ/build/refs/heads/main/nginx.patch
        git apply nginx.patch
        mkdir -p objs/lib
        cd objs/lib
        curl -fSL --retry 3 --retry-delay 5 -OL https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.gz
        curl -fSL --retry 3 --retry-delay 5 -OL https://zlib.net/zlib-1.3.2.tar.gz
        curl -fSL --retry 3 --retry-delay 5 -OL https://github.com/openssl/openssl/releases/download/openssl-3.6.2/openssl-3.6.2.tar.gz
        tar xf pcre2-10.47.tar.gz && mv pcre2-10.47 pcre2
        tar xf zlib-1.3.2.tar.gz && mv zlib-1.3.2 zlib
        tar xf openssl-3.6.2.tar.gz && mv openssl-3.6.2 openssl
        cd -
        git clone https://github.com/aperezdc/ngx-fancyindex.git
        git clone https://github.com/openresty/headers-more-nginx-module.git
        cd headers-more-nginx-module
        curl -fSL --retry 3 --retry-delay 5 -OL https://raw.githubusercontent.com/VariatezzZ/build/refs/heads/main/headers-more-nginx-module.patch
        git apply headers-more-nginx-module.patch
        cd ..
        auto/configure \
          --with-cc=cl \
          --builddir=objs \
          --prefix= \
          --conf-path=conf/nginx.conf \
          --pid-path=logs/nginx.pid \
          --http-log-path=logs/access.log \
          --error-log-path=logs/error.log \
          --sbin-path=nginx.exe \
          --http-client-body-temp-path=temp/client_body_temp \
          --http-proxy-temp-path=temp/proxy_temp \
          --http-fastcgi-temp-path=temp/fastcgi_temp \
          --http-scgi-temp-path=temp/scgi_temp \
          --http-uwsgi-temp-path=temp/uwsgi_temp \
          --with-cc-opt=-DFD_SETSIZE=1024 \
          --with-pcre=objs/lib/pcre2 \
          --with-zlib=objs/lib/zlib \
          --with-openssl=objs/lib/openssl \
          --with-openssl-opt='no-tests no-makedepend' \
          --with-file-aio \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_realip_module \
          --with-http_auth_request_module \
          --with-http_stub_status_module \
          --with-stream \
          --with-stream_ssl_module \
          --with-stream_realip_module \
          --with-http_addition_module \
          --with-http_dav_module \
          --add-module=headers-more-nginx-module\
          --add-module=ngx-fancyindex
        # NGX_CC_VER 由首步经 GITHUB_ENV 透传（含 for x64），此处仅确认架构已对齐
        grep 'OPENSSL_TARGET' objs/Makefile
        which nasm && nasm -v || echo "WARN: nasm missing, asm build may fail"
        cd ..

    - name: Build nginx
      shell: cmd
      run: |
        cd nginx
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        set CL=/WX-
        nmake

    - name: Prepare packing
      shell: msys2 {0}
      run: |
        set -eu
        cd nginx
        mkdir -p temp logs
        mv docs/html .
        mv objs/nginx.exe .
        ./nginx.exe -V

    - name: Verify arch (VS dumpbin)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        dumpbin /headers nginx\nginx.exe | findstr machine

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nginx
        if-no-files-found: error
        path: |
          ${{ GITHUB.WORKSPACE }}/nginx/nginx.exe
          ${{ GITHUB.WORKSPACE }}/nginx/conf
          ${{ GITHUB.WORKSPACE }}/nginx/contrib
          ${{ GITHUB.WORKSPACE }}/nginx/docs
          ${{ GITHUB.WORKSPACE }}/nginx/html
          ${{ GITHUB.WORKSPACE }}/nginx/logs
          ${{ GITHUB.WORKSPACE }}/nginx/temp
        retention-days: 7

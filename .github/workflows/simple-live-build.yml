name: simple-live-build
#推送Tag时触发
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/simple-live-build.yml"
env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      #克隆源代码
      - name: Clone source code
        shell: bash
        run: |
          git clone --single-branch -b dev https://github.com/xiaoyaocz/dart_simple_live.git

      # APK签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > dart_simple_live/simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> dart_simple_live/simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> dart_simple_live/simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> dart_simple_live/simple_live_app/android/key.properties

      #设置JAVA环境
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      #设置Android SDK环境
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: dart_simple_live/simple_live_app/.fvmrc
          cache: true

      - name: Configure Android JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd dart_simple_live/simple_live_app
          flutter pub get

      - name: Validate Android toolchain
        run: |
          cd dart_simple_live/simple_live_app
          flutter analyze --suggestions

      #打包APK
      - name: Build APK
        run: |
          cd dart_simple_live/simple_live_app
          flutter build apk --release --split-per-abi

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dart_simple_live/simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  # 打包Windows
  build-windows:
    runs-on: windows-2022
    steps:
      #克隆源代码
      - name: Clone source code
        shell: cmd
        run: |
          git clone --single-branch -b dev https://github.com/xiaoyaocz/dart_simple_live.git

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: dart_simple_live/simple_live_app/.fvmrc
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore Packages
        run: |
          cd dart_simple_live/simple_live_app
          flutter pub get

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # build Windows ZIP
      - name: Build Windows
        run: |
          cd dart_simple_live/simple_live_app
          flutter_distributor package --platform windows --targets zip --skip-clean

      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dart_simple_live/simple_live_app/build/dist/*/*.zip
